# ---------------------------------------------------------------------------
# Gradle / JVM
# ---------------------------------------------------------------------------
# The default heap is deliberately modest so that assembleDebug also succeeds
# in a 2 GB container. GitHub's ubuntu-latest runners have 7 GB and override
# this with -Dorg.gradle.jvmargs on the command line.
#
# Note: dexing the app (mergeDebugGlobalSynthetics/dexBuilder) needs roughly
# 1.6-2 GB. A container limited to 2 GB cannot complete assembleDebug no matter
# how this file is tuned; the CI workflow is the canonical way to produce an APK.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
# Compile in-process so a second JVM is never forked (low-RAM CI containers).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
