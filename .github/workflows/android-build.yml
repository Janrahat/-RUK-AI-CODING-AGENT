name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The repository ships no gradle-wrapper.jar (a binary), so the
          # action provides the Gradle distribution instead of ./gradlew.
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          # Supplied as repository secrets. The app never embeds provider
          # API keys; only the backend URL and the Google client id are
          # compiled in, and both are safe to expose.
          RUK_API_BASE_URL: ${{ secrets.RUK_API_BASE_URL }}
          RUK_GOOGLE_CLIENT_ID: ${{ secrets.RUK_GOOGLE_CLIENT_ID }}
        run: |
          gradle --no-daemon assembleDebug \
            -PrukApiBaseUrl="${RUK_API_BASE_URL:-https://api.example.com/}" \
            -PrukGoogleClientId="${RUK_GOOGLE_CLIENT_ID:-}"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruk-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
