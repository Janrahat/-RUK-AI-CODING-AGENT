name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      JWT_SECRET: ci-secret-not-used-in-production
      TOKEN_ENCRYPTION_KEY: ci-encryption-passphrase
      ENVIRONMENT: test
      CODE_EXEC_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Verify the app imports and serves /health
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import create_app
          with TestClient(create_app()) as client:
              body = client.get('/health').json()
              assert body['status'] == 'ok', body
              print('health:', body)
          "

  postgres:
    name: pytest against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruk
          POSTGRES_PASSWORD: ruk
          POSTGRES_DB: ruk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ruk:ruk@localhost:5432/ruk_test
      JWT_SECRET: ci-secret-not-used-in-production
      TOKEN_ENCRYPTION_KEY: ci-encryption-passphrase
      ENVIRONMENT: test
      CODE_EXEC_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -q
